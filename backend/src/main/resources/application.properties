# Server Port
server.port=8080

# Thời gian hiển thị loading chuyển trang (mili-giây). Đặt 0 để tắt.
y2kstore.page-loading-delay-ms=4

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/y2k_store_2026?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
# Do not let Hibernate create/alter tables. The database should follow database.sql.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialize only the schema declared in schema.sql.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Compatibility migration and local data seeding. Set false when the app must
# never add missing tables/columns or seed compatibility data at startup.
y2kstore.database-compatibility.enabled=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT Configuration
